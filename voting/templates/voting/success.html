<!DOCTYPE html>
<html>
<head>
    <title>Vote Submitted</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .success {
            font-size: 60px;
        }

        h1 {
            color: #1f3c88;
        }

        p {
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            background: #1f3c88;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: #162d68;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="success">✅</div>

        <h1>Vote Submitted Successfully!</h1>

        <p>Your vote has been recorded.</p>

        <a href="{% url 'results' %}">View Results</a>

        <a href="{% url 'home' %}">Back to Home</a>

    </div>

</body>
</html>
